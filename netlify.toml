[build]
publish = "static"
command = ""

# Preserve relative language links under the CV host's /cv rewrite. Otherwise
# Netlify transforms fr.html into /cv/fr, which receives the /cv prefix twice.
[build.processing.html]
pretty_urls = false

# Keep the two public language URLs stable, including old direct file links.
[[redirects]]
from = "https://cv.zqsdev.com/index.html"
to = "https://cv.zqsdev.com/"
status = 301
force = true

[[redirects]]
from = "https://cv.zqsdev.com/fr"
to = "https://cv.zqsdev.com/fr.html"
status = 301
force = true

[[redirects]]
from = "https://cv.zqsdev.com/fr/"
to = "https://cv.zqsdev.com/fr.html"
status = 301
force = true

# One canonical resume in English and French, with one PDF per language.
[[redirects]]
from = "https://founding.zqsdev.com/*"
to = "https://cv.zqsdev.com/:splat"
status = 301
force = true

[[redirects]]
from = "https://devops.zqsdev.com/*"
to = "https://cv.zqsdev.com/:splat"
status = 301
force = true

[[redirects]]
from = "https://software.zqsdev.com/*"
to = "https://cv.zqsdev.com/:splat"
status = 301
force = true

[[redirects]]
from = "/cv/founding"
to = "https://cv.zqsdev.com/"
status = 301
force = true

[[redirects]]
from = "/cv/founding/*"
to = "https://cv.zqsdev.com/:splat"
status = 301
force = true

[[redirects]]
from = "/cv/devops"
to = "https://cv.zqsdev.com/"
status = 301
force = true

[[redirects]]
from = "/cv/devops/*"
to = "https://cv.zqsdev.com/:splat"
status = 301
force = true

[[redirects]]
from = "/cv/software"
to = "https://cv.zqsdev.com/"
status = 301
force = true

[[redirects]]
from = "/cv/software/*"
to = "https://cv.zqsdev.com/:splat"
status = 301
force = true

# Public copies on the terminal host share the CV host's canonical URLs. Keep
# these host-specific: a generic /cv/* redirect can catch the internal rewrite.
[[redirects]]
from = "https://zqsdev.com/cv"
to = "https://cv.zqsdev.com/"
status = 301
force = true

[[redirects]]
from = "https://zqsdev.com/cv/*"
to = "https://cv.zqsdev.com/:splat"
status = 301
force = true

[[redirects]]
from = "https://www.zqsdev.com/cv"
to = "https://cv.zqsdev.com/"
status = 301
force = true

[[redirects]]
from = "https://www.zqsdev.com/cv/*"
to = "https://cv.zqsdev.com/:splat"
status = 301
force = true

# Root PDF aliases on the terminal host refer to the same canonical downloads.
# This also keeps the public-path PDF header rules below meaningful on all hosts.
[[redirects]]
from = "https://zqsdev.com/resume.pdf"
to = "https://cv.zqsdev.com/resume.pdf"
status = 301
force = true

[[redirects]]
from = "https://zqsdev.com/resume-fr.pdf"
to = "https://cv.zqsdev.com/resume-fr.pdf"
status = 301
force = true

[[redirects]]
from = "https://www.zqsdev.com/resume.pdf"
to = "https://cv.zqsdev.com/resume.pdf"
status = 301
force = true

[[redirects]]
from = "https://www.zqsdev.com/resume-fr.pdf"
to = "https://cv.zqsdev.com/resume-fr.pdf"
status = 301
force = true

# CV host uses the shared /cv directory, including same-origin assets and PDF.
[[redirects]]
from = "https://cv.zqsdev.com/*"
to = "/cv/:splat"
status = 200
force = true

# Calendly keeps its vanity subdomain but points to the external scheduler
[[redirects]]
from = "https://calendly.zqsdev.com/*"
to = "https://calendly.com/alexandre-zqsdev/30min"
status = 301
force = true

# Convenience redirect for the /calendly path on the main site
[[redirects]]
from = "/calendly"
to = "https://calendly.com/alexandre-zqsdev/30min"
status = 301
force = true

# Proxy API requests to the self-hosted Axum backend
[[redirects]]
from = "/api/*"
to = "https://api.zqsdev.com/api/:splat"
status = 200
force = true

# Catch-all so the SPA stays routable on zqsdev.com / www.zqsdev.com
[[redirects]]
from = "/*"
to = "static/index.html"
status = 200

[[headers]]
for = "/*.webp"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.png"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.svg"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.ico"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/index.html"
  [headers.values]
  Cache-Control = "no-store"

[[headers]]
for = "/*.css"
  [headers.values]
  Cache-Control = "no-store"

[[headers]]
for = "/*.pdf"
  [headers.values]
  Cache-Control = "no-store"

[[headers]]
for = "/pkg/*.js"
  [headers.values]
  Cache-Control = "no-store"

[[headers]]
for = "/pkg/*.wasm"
  [headers.values]
  Cache-Control = "no-store"

[[headers]]
for = "/data/*.json"
  [headers.values]
  Cache-Control = "no-store"

# Versioned CV font can be retained without risking stale typography.
[[headers]]
for = "/*.woff2"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# Discovery documents and HTML must be revalidated when the CV changes.
[[headers]]
for = "/cv/index.html"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/cv/fr.html"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/cv/robots.txt"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"
  Content-Type = "text/plain; charset=utf-8"

[[headers]]
for = "/cv/sitemap.xml"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"
  Content-Type = "application/xml; charset=utf-8"

[[headers]]
for = "/cv/llms.txt"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"
  Content-Type = "text/plain; charset=utf-8"

# The HTML profile is the preferred search result for each downloadable PDF.
# Netlify matches headers against the public URL before the CV host rewrite;
# retain both paths for direct /cv downloads and same-origin CV downloads.
[[headers]]
for = "/resume.pdf"
  [headers.values]
  Link = '<https://cv.zqsdev.com/>; rel="canonical"'

[[headers]]
for = "/resume-fr.pdf"
  [headers.values]
  Link = '<https://cv.zqsdev.com/fr.html>; rel="canonical"'

[[headers]]
for = "/cv/resume.pdf"
  [headers.values]
  Link = '<https://cv.zqsdev.com/>; rel="canonical"'

[[headers]]
for = "/cv/resume-fr.pdf"
  [headers.values]
  Link = '<https://cv.zqsdev.com/fr.html>; rel="canonical"'
