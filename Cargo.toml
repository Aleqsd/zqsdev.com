[workspace]
# api/ is the zqsdev-api Worker: a standalone workspace with its own Cargo.lock (worker 0.9.0 needs a
# newer wasm-bindgen than the frontend's locked 0.2.105).
exclude = ["api"]

[workspace.package]
version = "1.0.39"
edition = "2021"

[package]
name = "zqs_terminal"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.5"
console_error_panic_hook = "0.1"
futures = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
    "Document",
    "HtmlDocument",
    "HtmlHeadElement",
    "Window",
    "Node",
    "Element",
    "HtmlElement",
    "HtmlDivElement",
    "HtmlSpanElement",
    "HtmlButtonElement",
    "HtmlImageElement",
    "HtmlAudioElement",
    "HtmlInputElement",
    "CssStyleDeclaration",
    "DomTokenList",
    "NodeList",
    "EventTarget",
    "KeyboardEvent",
    "MouseEvent",
    "ClipboardEvent",
    "CompositionEvent",
    "DataTransfer",
    "InputEvent",
    "Event",
    "AbortController",
    "AbortSignal",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Blob",
    "Url",
    "Headers",
    "Location",
    "console",
    "DocumentFragment",
    "Text",
    "PointerEvent",
    "TouchEvent",
    "Storage",
]
